name: Backport

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: backport-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  backport:
    # Backports are triggered by adding supported backport labels.
    if: >
      (
        github.event.label.name == 'backport to 26.1.x' ||
        github.event.label.name == 'backport to 26.2.x'
      )
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backport pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_AUTHOR: ${{ github.actor }}
          LABEL_NAME: ${{ github.event.label.name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          case "$LABEL_NAME" in
            "backport to 26.1.x")
              target_branch="26.1.x"
              ;;
            "backport to 26.2.x")
              target_branch="26.2.x"
              ;;
            *)
              echo "Label '$LABEL_NAME' is not a supported backport label."
              exit 0
              ;;
          esac

          if ! git check-ref-format --branch "$target_branch" >/dev/null; then
            gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="Backport target \`$target_branch\` is not a valid branch name."
            exit 1
          fi

          if ! git ls-remote --exit-code --heads origin "$target_branch" >/dev/null; then
            gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="Backport target branch \`$target_branch\` does not exist."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          pr_title="$(jq -r '.title' <<<"$pr_json")"
          pr_url="$(jq -r '.html_url' <<<"$pr_json")"
          pr_author="$(jq -r '.user.login' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          base_sha="$(jq -r '.base.sha' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          merged="$(jq -r '.merged' <<<"$pr_json")"
          merge_commit_sha="$(jq -r '.merge_commit_sha // empty' <<<"$pr_json")"

          branch_suffix="$(printf '%s' "$target_branch" | tr '/' '-')"
          backport_branch="backport/$branch_suffix/pr-$PR_NUMBER"
          backport_title="[$target_branch] Backport #$PR_NUMBER: $pr_title"

          git fetch --no-tags origin "+refs/heads/$target_branch:refs/remotes/origin/$target_branch"
          git checkout -B "$backport_branch" "origin/$target_branch"

          post_comment() {
            gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$1" >/dev/null
          }

          picked_any=0
          has_conflicts=0
          conflict_files=""
          conflict_commit=""

          amend_cherry_pick_title() {
            original_body="$(git log -1 --format=%B | sed '1d')"
            if [[ -n "$(printf '%s' "$original_body" | tr -d '[:space:]')" ]]; then
              git commit --amend -m "$backport_title" -m "$original_body"
            else
              git commit --amend -m "$backport_title"
            fi
          }

          cherry_pick_or_record_conflict() {
            # Return success when the cherry-pick applies cleanly or is already present.
            commit_args=("$@")
            picked_commit="${commit_args[$((${#commit_args[@]} - 1))]}"

            if git cherry-pick -x "$@"; then
              amend_cherry_pick_title
              picked_any=1
              return 0
            fi

            if git diff --quiet && git diff --cached --quiet; then
              git cherry-pick --skip
              return 0
            fi

            conflict_files="$(git diff --name-only --diff-filter=U | sed 's/^/- /')"
            if [[ -z "$conflict_files" ]]; then
              conflict_files="- unknown"
            fi
            has_conflicts=1

            conflict_commit="$picked_commit"
            # Git cannot push an unresolved index, so commit the conflict markers and open a draft PR.
            git add -A
            git commit \
              -m "$backport_title" \
              -m "Cherry-pick of $picked_commit produced conflicts. Resolve the conflict markers manually before merging this backport PR."
            picked_any=1
            return 1
          }

          if [[ "$merged" == "true" && -n "$merge_commit_sha" ]]; then
            git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
            parent_count="$(git show -s --format=%P "$merge_commit_sha" | wc -w | tr -d ' ')"

            if (( parent_count > 1 )); then
              cherry_pick_or_record_conflict -m 1 "$merge_commit_sha" || true
            else
              cherry_pick_or_record_conflict "$merge_commit_sha" || true
            fi
          else
            git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
            git fetch --no-tags origin "pull/$PR_NUMBER/head:refs/remotes/origin/pr-$PR_NUMBER-head"

            mapfile -t commits < <(git rev-list --reverse "$base_sha..$head_sha")
            if (( ${#commits[@]} == 0 )); then
              post_comment "Backport to \`$target_branch\` was skipped because this PR has no commits to cherry-pick."
              exit 0
            fi

            for commit in "${commits[@]}"; do
              if ! cherry_pick_or_record_conflict "$commit"; then
                break
              fi
            done
          fi

          # Nothing to review if all requested changes are already in the target branch.
          if (( picked_any == 0 )) || git diff --quiet "origin/$target_branch"...HEAD; then
            post_comment "Backport to \`$target_branch\` was skipped because the changes are already present."
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$backport_branch" >/dev/null; then
            git push --force-with-lease origin HEAD:"$backport_branch"
          else
            git push origin HEAD:"$backport_branch"
          fi

          body_file="$RUNNER_TEMP/backport-body.md"
          cat > "$body_file" <<EOF
          Backport of #$PR_NUMBER to \`$target_branch\`.

          Source PR: $pr_url
          Source author: @$pr_author
          Triggered by: @$COMMENT_AUTHOR

          Please merge this backport PR with squash merge after review.
          EOF

          if (( has_conflicts == 1 )); then
            cat >> "$body_file" <<EOF

          This automated backport hit cherry-pick conflicts and was opened anyway.
          Please resolve the conflict markers manually before review and squash merge.
          If the source PR has commits after the conflicted commit, apply them manually after resolving conflicts.

          Conflicted commit: \`$conflict_commit\`
          Conflicted files:
          $conflict_files
          EOF
          fi

          existing_pr_url="$(gh pr list \
            --base "$target_branch" \
            --head "$backport_branch" \
            --state open \
            --json url \
            --jq '.[0].url // empty')"

          if [[ -n "$existing_pr_url" ]]; then
            gh pr edit "$existing_pr_url" \
              --title "$backport_title" \
              --body-file "$body_file"
            # Repeated conflicted runs should keep the existing PR in draft state.
            if (( has_conflicts == 1 )); then
              gh pr ready "$existing_pr_url" --undo
            fi
            backport_pr_url="$existing_pr_url"
          else
            create_args=(
              --base "$target_branch"
              --head "$backport_branch"
              --title "$backport_title"
              --body-file "$body_file"
            )
            if (( has_conflicts == 1 )); then
              # Conflicted backports are intentionally opened as draft PRs.
              create_args+=(--draft)
            fi
            backport_pr_url="$(gh pr create \
              "${create_args[@]}")"
          fi

          if (( has_conflicts == 1 )); then
            post_comment "$(cat <<EOF
          @$COMMENT_AUTHOR backport to \`$target_branch\` needs manual conflict resolution and was opened as a draft PR: $backport_pr_url

          Conflicted files:
          $conflict_files

          Conflicted commit: \`$conflict_commit\`
          Please resolve the conflict markers in the backport PR branch, then squash merge it after review.
          EOF
          )"
          else
            post_comment "Backport to \`$target_branch\` is ready: $backport_pr_url. Please merge the backport PR with squash merge after review."
          fi
